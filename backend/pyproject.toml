[project]
name = "rag-hive"
version = "0.1.0"
description = "Multi-agent benchmark of RAG pipelines (parsing x chunking x embedding x retrieval) on a PDF."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_hive"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # no per-file copyright headers; the repo LICENSE covers it
    "COM812", # conflicts with ruff format
    "ISC001", # conflicts with ruff format
    "D203",   # incompatible with D211 (google convention below)
    "D213",   # incompatible with D212
    "TD002",  # TODO author: not used in this repo
    "TD003",  # TODO issue link: not required for scaffolding TODOs
    "FIX002", # TODOs are allowed; they track planned work
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are how pytest works
    "PLR2004", # magic values are fine in assertions
    "D",       # test names document themselves
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once at import, by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
