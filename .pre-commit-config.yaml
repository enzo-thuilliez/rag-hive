# pre-commit hooks (backend Python + frontend TS). Install with `make install`, which runs
# `pre-commit install` for both the pre-commit and commit-msg stages.
#
# The mypy and frontend hooks run via `language: system`, so `uv` and `pnpm` must be on PATH
# and `frontend/node_modules` installed (`make install`).

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (backend/)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: eslint
        name: eslint (frontend/)
        entry: bash -c 'cd frontend && pnpm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false

      - id: prettier
        name: prettier (frontend/)
        entry: bash -c 'cd frontend && pnpm run format:check'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: tsc
        name: tsc (frontend/)
        entry: bash -c 'cd frontend && pnpm run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx|json)$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
