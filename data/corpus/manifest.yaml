# yaml-language-server: $schema=../../docs/schemas/corpus-manifest.schema.json
#
# Benchmark corpus: 10 PDFs, each pinned to an exact version by URL (or source page) and SHA-256.
#
# The PDFs are NOT in this repository and must never be committed: we have no right to
# redistribute them. `make corpus` downloads each `auto` entry to data/corpus/raw/<id>.pdf
# (gitignored), refuses any file whose SHA-256 differs from the pinned one, and skips files
# already present and valid. `manual` entries sit behind a login, cookie wall, disclaimer or bot
# block: download them yourself from `source_page` following `instructions`, save them as
# data/corpus/raw/<id>.pdf, and `make corpus` verifies them. A manual entry with an empty
# `sha256` is not pinned yet; `pages` and `properties` are filled once someone has inspected it.
#
# Fields: see CorpusEntry in backend/src/rag_hive/corpus/models.py (ADR-007).
# `properties` were filled by inspecting each PDF (pdfinfo, pdffonts, pdfimages, pdftotext and
# rendered pages), not from the publisher's description.
#
# `page_range` restricts the benchmark to some pages of a pinned file (the file stays whole).
# `download: derived` entries are generated by `make corpus` into data/corpus/derived/ (gitignored)
# from their source entry; they have no sha256 because their bytes depend on the rasterizer, and
# are regenerated whenever the source checksum, pages or dpi they record no longer match.

documents:
  - id: msci-gimi-methodology
    title: MSCI Global Investable Market Indexes Methodology (March 2026)
    publisher: MSCI
    url: https://support.msci.com/documents/10199/838d068c-7bac-8b96-03f6-6b2fe1067254
    sha256: 8147890bb504e2eff5941a7e4d38309ed9cbd5488d3fdcea1d2c8c3f050cc996
    pages: 191
    language: en
    properties:
      tables: true # worked examples of size-segment rankings, market classification tables
      images: true # flow diagrams of the index construction (p. 22, p. 128)
      multi_column: false
      scanned: false
      formulas: true # market capitalization and free-float formulas
    notes: >-
      First benchmark target. Pinned to the March 2026 edition on MSCI's support site, a
      versioned link. The "latest" link (msci.com/index/methodology/latest/GIMI) served the
      2026-10-15 edition (195 pages) when this was written and changes with every quarterly
      review, so it is not used.

