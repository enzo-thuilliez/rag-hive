  - id: frb-annual-report-1920
    title: Seventh Annual Report of the Federal Reserve Board, covering operations for 1920
    publisher: Federal Reserve Board (via FRASER, Federal Reserve Bank of St. Louis)
    url: https://fraser.stlouisfed.org/files/docs/publications/arfr/1920s/arfr_1920.pdf
    sha256: 7a557753e1febab53d92d2f7aaf315168686d76f7090e8a7594e2e4265cf1665
    pages: 645
    # 40 pages: 20-31 narrative prose (credit policy), 141-154 statistical tables with the
    # charts on 143, 151, 152 and 154, 163-176 the chart on 163 and member-bank tables.
    page_range: 20-31,141-154,163-176
    language: en
    properties:
      tables: true # statistical exhibits and balance sheets
      images: true # a section of charts
      multi_column: false
      scanned: true
      formulas: false
    notes: >-
      Scanned in 2009: one page image per page with an invisible OCR text layer added by FRASER.
      A text-layer parser reads that OCR; an OCR parser reads the images again. The benchmark
      uses the 40 pages of `page_range`. Public domain (US government work).

  - id: frb-annual-report-1920-image-only
    title: Seventh Annual Report of the Federal Reserve Board (1920), selected pages, image only
    publisher: Derived from frb-annual-report-1920
    download: derived
    derivation:
      kind: image_only
      source: frb-annual-report-1920
      dpi: 200
    pages: 40
    language: en
    properties:
      tables: true
      images: true
      multi_column: false
      scanned: true
      formulas: false
    notes: >-
      The 40 pages of the source's page_range rendered to grayscale images at 200 dpi, with no
      text layer: OCR parsers face a true scan, text-layer parsers find nothing. Compare with
      the source entry on the same pages.
