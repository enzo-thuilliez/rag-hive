name: Bug
description: Something behaves differently from the contract or the docs
title: "fix(scope): "
labels: ["type:fix"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Cite AGENTS.md or docs/architecture.md if the contract says so.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1. "
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python / Node versions, LLM and embedding provider"
