# Labels as code, synced by .github/workflows/labels.yml on every change to this file.
# Every issue: one type:*, one or more area:*, one priority:*.
- name: "area:agents"
  color: "0e8a16"
  description: "LangGraph agents and workflow"
- name: "area:backend"
  color: "0e8a16"
  description: "FastAPI app, components, config"
- name: "area:ci"
  color: "0e8a16"
  description: "GitHub Actions, Dependabot, hooks"
- name: "area:corpus"
  color: "0e8a16"
  description: "Corpus manifest and downloads"
- name: "area:docs"
  color: "0e8a16"
  description: "README, AGENTS, DECISIONS, architecture"
- name: "area:eval"
  color: "0e8a16"
  description: "Golden set, span matching, metrics"
- name: "area:events"
  color: "0e8a16"
  description: "AgentEvent schema and SSE stream"
- name: "area:frontend"
  color: "0e8a16"
  description: "React dashboard"
- name: "priority:p0"
  color: "b60205"
  description: "Blocks the current milestone"
- name: "priority:p1"
  color: "d93f0b"
  description: "Needed for the milestone"
- name: "priority:p2"
  color: "fbca04"
  description: "Nice to have, can slip"
- name: "type:chore"
  color: "1d76db"
  description: "Maintenance with no behaviour change"
- name: "type:ci"
  color: "1d76db"
  description: "CI workflows and repo automation"
- name: "type:docs"
  color: "1d76db"
  description: "Documentation only"
- name: "type:feat"
  color: "1d76db"
  description: "New capability"
- name: "type:fix"
  color: "1d76db"
  description: "Behaviour differs from the contract or docs"
- name: "type:perf"
  color: "1d76db"
  description: "Faster or lighter, same behaviour"
- name: "type:refactor"
  color: "1d76db"
  description: "Restructure without behaviour change"
- name: "type:test"
  color: "1d76db"
  description: "Tests only"
