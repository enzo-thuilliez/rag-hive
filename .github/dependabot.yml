# Weekly version updates. Each ecosystem's group takes minor and patch bumps only, in one PR;
# a semver-major bump falls out of the group and comes as its own PR, reviewed by hand.
# Security updates are a repo setting and run on their own schedule. Commit messages stay
# conventional: `ci(deps): …`, `chore(deps): …`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
    labels: [type:ci, area:ci, priority:p2]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
    labels: [type:chore, area:backend, priority:p2]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.72 declares `typescript: ">=4.8.4 <6.1.0"` and lint fails on newer
      # TypeScript ("typescript-eslint does not support TS 7.0", PR #55). Lift this once
      # typescript-eslint supports the new version, and bump both in one PR.
      - dependency-name: typescript
        versions: [">=6.1"]
    commit-message:
      prefix: chore
      include: scope
    labels: [type:chore, area:frontend, priority:p2]
